<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f4ef" />
  <title>慕尼黑今天穿什么？</title>
  <style>
    :root {
      --bg: #f7f4ef;
      --card: rgba(255,255,255,.82);
      --text: #202124;
      --muted: #6f7479;
      --line: rgba(32,33,36,.09);
      --shadow: 0 18px 50px rgba(32,33,36,.09);
      --accent: #202124;
      --soft: #ece7df;
      --good: #e9f6ee;
      --warn: #fff2d9;
      --rain: #e8f1fb;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 5%, rgba(255,255,255,.95), transparent 30%),
        radial-gradient(circle at 86% 18%, rgba(226,234,244,.72), transparent 30%),
        var(--bg);
    }

    .wrap {
      width: min(1080px, calc(100% - 28px));
      margin: 0 auto;
      padding: 34px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .location {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.62);
      color: var(--muted);
      font-size: 14px;
      backdrop-filter: blur(10px);
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      cursor: pointer;
      transition: transform .18s ease, opacity .18s ease;
    }
    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: .55; cursor: progress; }

    .hero {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .card {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .main-card {
      padding: 30px;
      min-height: 330px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 14px;
      letter-spacing: .04em;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 7vw, 72px);
      line-height: .98;
      letter-spacing: -.055em;
    }

    .temp-row {
      margin-top: 26px;
      display: flex;
      align-items: flex-end;
      gap: 14px;
      flex-wrap: wrap;
    }

    .now-temp {
      font-size: clamp(54px, 10vw, 96px);
      line-height: .8;
      font-weight: 760;
      letter-spacing: -.07em;
    }

    .condition {
      font-size: 18px;
      padding-bottom: 3px;
    }

    .range {
      color: var(--muted);
      margin-top: 10px;
      font-size: 15px;
    }

    .outfit-card {
      padding: 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .outfit-icon { font-size: 48px; }
    .outfit-title { font-size: 27px; font-weight: 760; margin: 12px 0 8px; }
    .outfit-text { color: #44494e; line-height: 1.7; font-size: 16px; }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .badge {
      padding: 8px 11px;
      border-radius: 999px;
      font-size: 13px;
      background: var(--soft);
    }
    .badge.rain { background: var(--rain); }
    .badge.warn { background: var(--warn); }
    .badge.good { background: var(--good); }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 16px;
    }

    .metric { padding: 20px; min-height: 138px; }
    .metric .label { color: var(--muted); font-size: 13px; }
    .metric .value { margin-top: 10px; font-size: 28px; font-weight: 760; letter-spacing: -.03em; }
    .metric .hint { margin-top: 6px; color: var(--muted); font-size: 13px; line-height: 1.45; }

    .timeline {
      padding: 22px;
      margin-bottom: 16px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      margin-bottom: 14px;
    }
    .section-title h2 { margin: 0; font-size: 20px; }
    .section-title span { color: var(--muted); font-size: 13px; }

    .hours {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .hour {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      background: rgba(255,255,255,.55);
    }
    .hour .time { color: var(--muted); font-size: 13px; }
    .hour .icon { font-size: 25px; margin: 8px 0 4px; }
    .hour .t { font-size: 22px; font-weight: 720; }
    .hour .rainp { color: var(--muted); margin-top: 5px; font-size: 12px; }

    .forecast {
      padding: 22px;
    }

    .days {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .day {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      background: rgba(255,255,255,.55);
    }
    .day .name { font-weight: 700; }
    .day .icon { font-size: 30px; margin: 10px 0 5px; }
    .day .temps { font-size: 17px; }
    .day .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }

    .status {
      margin-top: 14px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }
    .status a { color: inherit; }

    .loading {
      animation: pulse 1.2s ease-in-out infinite alternate;
    }
    @keyframes pulse { to { opacity: .45; } }

    .error {
      padding: 16px 18px;
      border-radius: 18px;
      background: #fff1f1;
      color: #8a2d2d;
      margin-bottom: 16px;
      display: none;
    }

    @media (max-width: 820px) {
      .hero { grid-template-columns: 1fr; }
      .grid { grid-template-columns: repeat(2, 1fr); }
      .hours, .days { grid-template-columns: repeat(2, 1fr); }
      .main-card { min-height: 300px; }
    }

    @media (max-width: 460px) {
      .wrap { width: min(100% - 20px, 1080px); padding-top: 18px; }
      .main-card, .outfit-card { padding: 22px; }
      .grid { gap: 10px; }
      .metric { padding: 16px; min-height: 126px; }
      .topbar { align-items: flex-start; }
      .location { max-width: 70%; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="topbar">
      <div class="location">📍 München · Europe/Berlin</div>
      <button id="refreshBtn" type="button">刷新天气</button>
    </div>

    <div id="errorBox" class="error"></div>

    <section class="hero">
      <article class="card main-card">
        <div>
          <div class="eyebrow" id="dateText">正在获取今天的天气…</div>
          <h1>今天穿什么？</h1>
        </div>
        <div>
          <div class="temp-row">
            <div class="now-temp loading" id="currentTemp">--°</div>
            <div class="condition" id="currentCondition">加载中 ☁️</div>
          </div>
          <div class="range" id="todayRange">今日 --° / --° · 体感 --°</div>
        </div>
      </article>

      <article class="card outfit-card">
        <div>
          <div class="outfit-icon" id="outfitIcon">🧥</div>
          <div class="outfit-title" id="outfitTitle">正在搭配…</div>
          <div class="outfit-text" id="outfitText">我会综合最低温、最高温、早晚温差、降雨概率和风速来给你建议。</div>
        </div>
        <div class="badge-row" id="badgeRow"></div>
      </article>
    </section>

    <section class="grid">
      <article class="card metric">
        <div class="label">☔ 雨伞</div>
        <div class="value" id="umbrellaValue">--</div>
        <div class="hint" id="umbrellaHint">正在检查降雨概率</div>
      </article>
      <article class="card metric">
        <div class="label">🌡️ 全天温差</div>
        <div class="value" id="tempGapValue">--°C</div>
        <div class="hint" id="tempGapHint">最低温 → 最高温</div>
      </article>
      <article class="card metric">
        <div class="label">🌅 早上 07:00</div>
        <div class="value" id="morningValue">--°</div>
        <div class="hint" id="morningHint">体感 --°</div>
      </article>
      <article class="card metric">
        <div class="label">🌙 晚上 19:00</div>
        <div class="value" id="eveningValue">--°</div>
        <div class="hint" id="eveningHint">体感 --°</div>
      </article>
    </section>

    <section class="card timeline">
      <div class="section-title">
        <h2>今天分时天气</h2>
        <span>出门前重点看早晚 👀</span>
      </div>
      <div class="hours" id="hours"></div>
    </section>

    <section class="card forecast">
      <div class="section-title">
        <h2>接下来几天</h2>
        <span>先看看衣柜要不要换季</span>
      </div>
      <div class="days" id="days"></div>
    </section>

    <div class="status" id="statusText">
      天气数据来自 <a href="https://open-meteo.com/" target="_blank" rel="noreferrer">Open-Meteo</a>。穿搭建议仅作日常参考。
    </div>
  </main>

<script>
  const LAT = 48.1374;
  const LON = 11.5755;
  const TZ = 'Europe/Berlin';

  const $ = (id) => document.getElementById(id);

  const weatherMap = {
    0: ['晴朗', '☀️'], 1: ['大致晴朗', '🌤️'], 2: ['局部多云', '⛅'], 3: ['阴天', '☁️'],
    45: ['有雾', '🌫️'], 48: ['雾凇', '🌫️'],
    51: ['小毛毛雨', '🌦️'], 53: ['毛毛雨', '🌦️'], 55: ['较强毛毛雨', '🌧️'],
    56: ['冻毛毛雨', '🌧️'], 57: ['较强冻毛毛雨', '🌧️'],
    61: ['小雨', '🌦️'], 63: ['中雨', '🌧️'], 65: ['大雨', '🌧️'],
    66: ['冻雨', '🌧️'], 67: ['较强冻雨', '🌧️'],
    71: ['小雪', '🌨️'], 73: ['中雪', '🌨️'], 75: ['大雪', '❄️'], 77: ['雪粒', '❄️'],
    80: ['阵雨', '🌦️'], 81: ['较强阵雨', '🌧️'], 82: ['强阵雨', '⛈️'],
    85: ['阵雪', '🌨️'], 86: ['强阵雪', '❄️'],
    95: ['雷雨', '⛈️'], 96: ['雷雨伴冰雹', '⛈️'], 99: ['强雷雨伴冰雹', '⛈️']
  };

  function weatherInfo(code) {
    return weatherMap[code] || ['天气变化', '🌥️'];
  }

  function round(v) {
    return Number.isFinite(v) ? Math.round(v) : '--';
  }

  function localDateLabel(dateStr) {
    const d = new Date(dateStr + 'T12:00:00');
    return new Intl.DateTimeFormat('zh-CN', {
      timeZone: TZ, weekday: 'long', month: 'long', day: 'numeric'
    }).format(d);
  }

  function weekday(dateStr, index) {
    if (index === 0) return '今天';
    if (index === 1) return '明天';
    const d = new Date(dateStr + 'T12:00:00');
    return new Intl.DateTimeFormat('zh-CN', { timeZone: TZ, weekday: 'short' }).format(d);
  }

  function hourIndex(hourly, date, hour) {
    const key = `${date}T${String(hour).padStart(2, '0')}:00`;
    return hourly.time.indexOf(key);
  }

  function sample(hourly, date, hour) {
    const i = hourIndex(hourly, date, hour);
    if (i < 0) return { temp: NaN, apparent: NaN, rain: 0, code: 3, wind: 0 };
    return {
      temp: hourly.temperature_2m[i],
      apparent: hourly.apparent_temperature[i],
      rain: hourly.precipitation_probability[i] ?? 0,
      code: hourly.weather_code[i],
      wind: hourly.wind_speed_10m[i] ?? 0
    };
  }

  function getOutfit({ min, max, apparentMin, morning, evening, rainProb, rainSum, wind }) {
    const coldPoint = Math.min(min, apparentMin, morning.apparent, evening.apparent);
    const gap = max - min;
    let icon = '👕';
    let title = '轻松日常穿搭';
    let base = '';

    if (coldPoint <= 0) {
      icon = '🧣'; title = '冬装模式';
      base = '厚外套或羽绒服 + 保暖内搭 + 长裤，早晚最好加围巾。';
    } else if (coldPoint <= 7) {
      icon = '🧥'; title = '外套一定要有';
      base = '建议毛衣/卫衣 + 中厚外套 + 长裤，早上体感会比较冷。';
    } else if (coldPoint <= 12) {
      icon = '🧥'; title = '薄外套叠穿';
      base = '长袖或薄针织 + 外套 + 长裤最稳，热了可以脱一层。';
    } else if (max <= 20) {
      icon = '👖'; title = '长袖 / 薄外套';
      base = '长袖上衣配长裤就很舒服，怕冷的话带一件轻薄外套。';
    } else if (max <= 26) {
      icon = '👕'; title = '白天轻装，早晚加一层';
      base = '白天短袖或薄上衣即可，早晚建议准备薄衬衫/开衫。';
    } else if (max <= 31) {
      icon = '🕶️'; title = '夏装模式';
      base = '短袖/背心 + 轻薄下装，尽量选透气面料。';
    } else {
      icon = '🥵'; title = '很热，穿轻一点';
      base = '尽量穿轻薄、宽松、透气的夏装，记得补水并注意防晒。';
    }

    const extras = [];
    if (gap >= 10) extras.push(`今天温差约 ${round(gap)}°C，建议分层穿，别被中午的温度骗了。`);
    else if (gap >= 7) extras.push('早晚和中午差得有点明显，叠穿最省心。');
    if (wind >= 30) extras.push('风比较大，外层最好选能挡风的。');
    if (rainProb >= 45 || rainSum >= 0.8) extras.push('有明显降雨风险，鞋子也尽量选不怕湿的。');

    return { icon, title, text: [base, ...extras].join(' ') };
  }

  function umbrellaAdvice(prob, sum) {
    if (prob >= 55 || sum >= 2) return ['要带伞', `最高降雨概率 ${round(prob)}%，预计降水 ${sum.toFixed(1)} mm`, 'rain'];
    if (prob >= 30 || sum >= 0.4) return ['建议带小伞', `有阵雨可能，最高概率 ${round(prob)}%`, 'warn'];
    return ['不用特意带', `最高降雨概率 ${round(prob)}%`, 'good'];
  }

  function renderHours(hourly, date) {
    const slots = [7, 12, 16, 19];
    $('hours').innerHTML = slots.map(h => {
      const s = sample(hourly, date, h);
      const [label, icon] = weatherInfo(s.code);
      return `<div class="hour">
        <div class="time">${String(h).padStart(2,'0')}:00</div>
        <div class="icon" title="${label}">${icon}</div>
        <div class="t">${round(s.temp)}°</div>
        <div class="rainp">降雨 ${round(s.rain)}% · 体感 ${round(s.apparent)}°</div>
      </div>`;
    }).join('');
  }

  function renderDays(daily) {
    const count = Math.min(4, daily.time.length);
    $('days').innerHTML = Array.from({ length: count }, (_, i) => {
      const [label, icon] = weatherInfo(daily.weather_code[i]);
      return `<div class="day">
        <div class="name">${weekday(daily.time[i], i)}</div>
        <div class="icon" title="${label}">${icon}</div>
        <div class="temps">${round(daily.temperature_2m_max[i])}° / ${round(daily.temperature_2m_min[i])}°</div>
        <div class="meta">${label} · 降雨 ${round(daily.precipitation_probability_max[i])}%</div>
      </div>`;
    }).join('');
  }

  async function loadWeather() {
    const btn = $('refreshBtn');
    btn.disabled = true;
    $('errorBox').style.display = 'none';

    const params = new URLSearchParams({
      latitude: LAT,
      longitude: LON,
      timezone: TZ,
      forecast_days: 5,
      current: 'temperature_2m,apparent_temperature,weather_code,precipitation,wind_speed_10m',
      hourly: 'temperature_2m,apparent_temperature,precipitation_probability,weather_code,wind_speed_10m',
      daily: 'weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,sunrise,sunset'
    });

    try {
      const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
      if (!response.ok) throw new Error(`天气服务返回 ${response.status}`);
      const data = await response.json();
      const date = data.daily.time[0];
      const morning = sample(data.hourly, date, 7);
      const evening = sample(data.hourly, date, 19);
      const min = data.daily.temperature_2m_min[0];
      const max = data.daily.temperature_2m_max[0];
      const apparentMin = data.daily.apparent_temperature_min[0];
      const rainProb = data.daily.precipitation_probability_max[0] ?? 0;
      const rainSum = data.daily.precipitation_sum[0] ?? 0;
      const wind = data.daily.wind_speed_10m_max[0] ?? 0;
      const [condition, conditionIcon] = weatherInfo(data.current.weather_code);

      $('dateText').textContent = `${localDateLabel(date)} · 慕尼黑`;
      $('currentTemp').textContent = `${round(data.current.temperature_2m)}°`;
      $('currentTemp').classList.remove('loading');
      $('currentCondition').textContent = `${condition} ${conditionIcon}`;
      $('todayRange').textContent = `今日 ${round(max)}° / ${round(min)}° · 当前体感 ${round(data.current.apparent_temperature)}°`;

      const outfit = getOutfit({ min, max, apparentMin, morning, evening, rainProb, rainSum, wind });
      $('outfitIcon').textContent = outfit.icon;
      $('outfitTitle').textContent = outfit.title;
      $('outfitText').textContent = outfit.text;

      const umbrella = umbrellaAdvice(rainProb, rainSum);
      $('umbrellaValue').textContent = umbrella[0];
      $('umbrellaHint').textContent = umbrella[1];
      $('tempGapValue').textContent = `${round(max - min)}°C`;
      $('tempGapHint').textContent = `${round(min)}° → ${round(max)}°，早晚记得留一层`;
      $('morningValue').textContent = `${round(morning.temp)}°`;
      $('morningHint').textContent = `体感 ${round(morning.apparent)}° · 降雨 ${round(morning.rain)}%`;
      $('eveningValue').textContent = `${round(evening.temp)}°`;
      $('eveningHint').textContent = `体感 ${round(evening.apparent)}° · 降雨 ${round(evening.rain)}%`;

      const badges = [
        `<span class="badge ${umbrella[2]}">☔ ${umbrella[0]}</span>`,
        `<span class="badge ${max - min >= 8 ? 'warn' : 'good'}">🌡️ 温差 ${round(max - min)}°</span>`,
        `<span class="badge ${wind >= 30 ? 'warn' : ''}">💨 最大风速 ${round(wind)} km/h</span>`
      ];
      if (apparentMin <= min - 3) badges.push(`<span class="badge warn">🥶 体感比气温更冷</span>`);
      $('badgeRow').innerHTML = badges.join('');

      renderHours(data.hourly, date);
      renderDays(data.daily);

      const updated = new Intl.DateTimeFormat('zh-CN', {
        timeZone: TZ, hour: '2-digit', minute: '2-digit'
      }).format(new Date());
      $('statusText').innerHTML = `最后刷新：${updated} · 天气数据来自 <a href="https://open-meteo.com/" target="_blank" rel="noreferrer">Open-Meteo</a>。穿搭建议仅作日常参考。`;
    } catch (err) {
      $('errorBox').style.display = 'block';
      $('errorBox').textContent = `天气加载失败：${err.message}。请稍后点“刷新天气”再试。`;
    } finally {
      btn.disabled = false;
    }
  }

  $('refreshBtn').addEventListener('click', loadWeather);
  loadWeather();
</script>
</body>
</html>
